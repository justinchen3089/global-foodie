# Publishes the website (only the public site files) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repo variable PROXY_URL (Settings → Secrets and variables → Actions → Variables):
#   your Cloudflare Worker URL. When set, the site runs the full Gemini agent; when not, it runs in demo mode.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (no eval data, proxy code or docs)
        run: |
          mkdir _site
          cp -r index.html style.css js .nojekyll _site/
      - name: Point the site at the Gemini proxy (if the PROXY_URL variable is set)
        if: ${{ vars.PROXY_URL != '' }}
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          sed -i "s#https://global-foodie-proxy.YOUR-SUBDOMAIN.workers.dev#${PROXY_URL%/}#" _site/js/config.js
          grep -n "PROXY_URL:" _site/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
